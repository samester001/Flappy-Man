<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Man - Cartoon Web Game</title>
  <style>
/* Flappy Man Game - Styles (reconstructed) */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(#f5f7fa,#e9eef3); color:#222; }
body { --ui-scale: clamp(0.9, 100vh/900, 1.2); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(12px + env(safe-area-inset-top)) 8px calc(32px + env(safe-area-inset-bottom)); }

#game-container { position:relative; width:min(420px,90vw); height:calc(100vh - 40px); max-height:900px; background:#dff4ff; border-radius:14px; overflow:hidden; box-shadow:0 6px 18px -6px rgba(0,0,0,0.35),0 2px 6px rgba(0,0,0,0.15); user-select:none; display:flex; align-items:center; justify-content:center; padding:0; }
#game-container:focus-within { outline:2px solid #66c2ff; }

canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:block; max-width:100%; max-height:100%; outline:none; background:linear-gradient(#bfe7ff,#e7f7ff); image-rendering:pixelated; }

.ui { position:absolute; pointer-events:none; font-weight:600; z-index:3; }

/* UPDATED score + high score */
#score-bubble, #high-score-bubble { position:absolute; top:10px; min-width:48px; padding:10px 14px; text-align:center; font-size:20px; line-height:1; background:rgba(255,255,255,0.35); backdrop-filter:blur(10px) saturate(140%); border:1px solid rgba(255,255,255,0.55); border-radius:28px; box-shadow:0 4px 12px -4px rgba(0,0,0,.35); color:#17321f; font-weight:600; }
#score-bubble { left:10px; }
#high-score-bubble { right:10px; font-weight:700; }

#banner { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.94); min-width:220px; max-width:300px; padding:calc(26px * var(--ui-scale)) calc(22px * var(--ui-scale)); text-align:center; font-size:calc(21px * var(--ui-scale)); font-weight:700; line-height:1.3; letter-spacing:.35px; background:linear-gradient(150deg,rgba(255,255,255,0.46),rgba(255,255,255,0.20)); color:#0f2a22; border:1px solid rgba(255,255,255,0.65); border-radius:24px; box-shadow:0 14px 34px -12px rgba(0,0,0,.5); opacity:0; transition:opacity .35s, transform .35s; pointer-events:none; -webkit-font-smoothing:antialiased; backdrop-filter:blur(15px) saturate(150%); }
#banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
#banner.countdown { font-size:calc(60px * var(--ui-scale)); font-weight:800; padding:26px 38px; background:linear-gradient(150deg,rgba(255,255,255,0.7),rgba(255,255,255,0.32)); color:#073d66; border:1px solid rgba(255,255,255,0.75); box-shadow:0 16px 40px -14px rgba(0,0,0,.55); border-radius:30px; }

#milestone-banner { position:absolute; top:70px; left:50%; transform:translateX(-50%) translateY(-18px); padding:12px 22px; font-size:18px; background:linear-gradient(135deg,rgba(255,223,122,0.55),rgba(255,179,71,0.35)); border-radius:20px; color:#4a3000; font-weight:700; border:1px solid rgba(255,255,255,0.55); box-shadow:0 6px 18px -6px rgba(0,0,0,.4); opacity:0; transition:opacity .4s, transform .4s; pointer-events:none; backdrop-filter:blur(8px) saturate(140%); }
#milestone-banner.show { opacity:1; transform:translateX(-50%) translateY(0); }

.btns { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:12px; pointer-events:auto; }
.game-btn { cursor:pointer; font-size:15px; font-weight:600; padding:10px 22px; border:1px solid rgba(255,255,255,0.55); border-radius:30px; background:linear-gradient(135deg,rgba(79,172,254,0.45),rgba(0,200,255,0.35)); color:#fff; letter-spacing:.5px; box-shadow:0 6px 14px -6px rgba(0,0,0,.45); transition:transform .15s, box-shadow .25s, background .35s; backdrop-filter:blur(10px) saturate(160%); }
.game-btn:hover { transform:translateY(-3px); box-shadow:0 12px 28px -10px rgba(0,0,0,.55); background:linear-gradient(135deg,rgba(79,172,254,0.6),rgba(0,200,255,0.5)); }
.game-btn:active { transform:translateY(1px) scale(.97); box-shadow:0 4px 10px -4px rgba(0,0,0,.5); }
.game-btn:focus-visible { outline:3px solid #ffe27a; outline-offset:2px; }

@media (max-width:520px){
  #game-container { width:95vw; height:calc(100vh - 24px); }
}
  </style>
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" aria-label="Flappy Man Game" role="region"></canvas>
    <div class="ui">
      <div id="score-bubble">0</div>
      <div id="high-score-bubble" aria-label="High Score" title="High Score">0</div>
      <div id="milestone-banner"></div>
      <div id="banner" class="banner"></div>
      <div class="btns">
        <button id="start-btn" class="game-btn">Start</button>
        <button id="restart-btn" class="game-btn" style="display:none;">Restart</button>
        <button id="mute-btn" class="game-btn" title="Toggle sound">🔊</button>
      </div>
    </div>
  </div>
  <script>
    // --- Game Constants ---
    const GAME_WIDTH = 360;
    const GAME_HEIGHT = 640;
    const GROUND_HEIGHT = 80;
    const PIPE_WIDTH = 60;
    const PIPE_GAP_START = 220; // Even larger gap for easier start
    const PIPE_GAP_MIN = 140; // Minimum gap size
    const PIPE_MIN = 80;
    const PIPE_MAX = GAME_HEIGHT - GROUND_HEIGHT - PIPE_GAP_START - 40;
    const PIPE_SPEED_START = 1.6; // Even slower start
    const PIPE_SPEED_INC = 0.15; // Increase per difficulty level
    const PIPE_FREQ_START = 1800; // Even more time between pipes at start
    const PIPE_FREQ_MIN = 900; // Minimum time between pipes
    const GRAVITY = 0.38;
    const FLAP_VELOCITY = -7.2;
    const MAX_DROP = 10.5;
    const MAN_X = GAME_WIDTH * 0.25;
    const MAN_RADIUS = 28;
    const ANIM_FREQ = 60; // ms
    const MILESTONES = [5, 10, 20, 50, 100];
    const DIFFICULTY_INTERVAL = 20; // Change difficulty every 20 pipes
    // Color testing switch - enable all pipe colors from start
    const COLOR_TESTING_MODE = false;

    // --- Audio Manager (WebAudio simple synth + music) ---
    const AudioManager = (function(){
      let ctx = null;
      let masterGain = null;
      let musicSource = null;
      let muted = false;

      function init() {
        if (ctx) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        ctx = new Ctx();
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.9;
        masterGain.connect(ctx.destination);
      }

      function playTone(freq, type='sine', when=0, duration=0.12, gain=0.12){
        if (!ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.value = gain;
        o.connect(g); g.connect(masterGain);
        o.start(ctx.currentTime + when);
        g.gain.setValueAtTime(gain, ctx.currentTime + when);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + when + duration);
        o.stop(ctx.currentTime + when + duration + 0.02);
      }

      function playFlap(){ init(); if (!ctx) return; playTone(880, 'sine', 0, 0.08, 0.08); }
      function playScore(){ init(); if (!ctx) return; playTone(1240,'triangle',0,0.18,0.10); playTone(1560,'sine',0.04,0.12,0.07); }
      function playHit(){ init(); if (!ctx) return; playTone(220,'sawtooth',0,0.28,0.18); }

      function toggleMute(){ init(); if (!masterGain) return; muted = !muted; masterGain.gain.value = muted ? 0 : 0.9; return muted; }

      return { init, playFlap, playScore, playHit, toggleMute };
    })();

  // --- Game State ---
  let state = 'init'; // init, countdown, running, paused, gameover
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappyManHighScore') || '0', 10);
    let pipes = [];
    let pipeSpeed = PIPE_SPEED_START;
    let pipeFreq = PIPE_FREQ_START;
    let pipeGap = PIPE_GAP_START;
    let pipeCount = 0; // Track total pipes spawned
    let difficultyLevel = 0;
    let lastPipeTime = 0;
    let man = null;
    let animTimer = 0;
    let milestoneIdx = 0;
    let bannerTimeout = null;
    let countdown = 3;
    let countdownTimer = null;
    let touchFlap = false;

    // --- DOM Elements ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreBubble = document.getElementById('score-bubble');
    const milestoneBanner = document.getElementById('milestone-banner');
    const banner = document.getElementById('banner');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const gameContainer = document.getElementById('game-container');
    const highScoreBubble = document.getElementById('high-score-bubble');

    // --- Responsive Canvas ---
    function resizeCanvas() {
      // Calculate the largest size that fits while preserving aspect ratio
      const containerW = gameContainer.clientWidth;
      const containerH = gameContainer.clientHeight;
      const containerRatio = containerW / containerH;
      // Use cover mode: scale to fill container, cropping overflow when needed
      const scale = Math.max(containerW / GAME_WIDTH, containerH / GAME_HEIGHT);
      const EPS = 1; // small guard to avoid fractional gaps
      let displayW = Math.round(GAME_WIDTH * scale) + EPS;
      let displayH = Math.round(GAME_HEIGHT * scale) + EPS;

      // Center the canvas inside the container
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  canvas.style.left = '50%';
  canvas.style.top = '50%';
  canvas.style.transform = 'translate(-50%,-50%)';

  // Align UI overlay to the visible canvas area so DOM UI (buttons/bubbles) match canvas coordinates
  const canvasRect = canvas.getBoundingClientRect();
  const ui = document.querySelector('.ui');
  if (ui) {
    // Position UI absolutely relative to the game container
    const containerRect = gameContainer.getBoundingClientRect();
    ui.style.position = 'absolute';
    ui.style.left = (canvasRect.left - containerRect.left) + 'px';
    ui.style.top = (canvasRect.top - containerRect.top) + 'px';
    ui.style.width = canvasRect.width + 'px';
    ui.style.height = canvasRect.height + 'px';
    ui.style.pointerEvents = 'none';
    // Enable pointer-events for interactive children (buttons)
    const interactive = ui.querySelectorAll('.btns, button');
    interactive.forEach(el => el.style.pointerEvents = 'auto');
    // Responsive UI scaling: keep UI elements proportional to canvas display size
    const uiScale = Math.max(0.55, Math.min(1.15, canvasRect.width / GAME_WIDTH));
    // Score bubbles
    if (scoreBubble) {
      scoreBubble.style.fontSize = Math.round(20 * uiScale) + 'px';
      scoreBubble.style.padding = Math.round(10 * uiScale) + 'px ' + Math.round(14 * uiScale) + 'px';
      scoreBubble.style.minWidth = Math.round(48 * uiScale) + 'px';
      scoreBubble.style.borderRadius = Math.round(28 * uiScale) + 'px';
    }
    if (highScoreBubble) {
      highScoreBubble.style.fontSize = Math.round(20 * uiScale) + 'px';
      highScoreBubble.style.padding = Math.round(10 * uiScale) + 'px ' + Math.round(14 * uiScale) + 'px';
      highScoreBubble.style.minWidth = Math.round(48 * uiScale) + 'px';
      highScoreBubble.style.borderRadius = Math.round(28 * uiScale) + 'px';
    }
    // Buttons
    if (startBtn) {
      startBtn.style.fontSize = Math.round(15 * uiScale) + 'px';
      startBtn.style.padding = Math.round(8 * uiScale) + 'px ' + Math.round(18 * uiScale) + 'px';
      startBtn.style.borderRadius = Math.round(26 * uiScale) + 'px';
    }
    if (restartBtn) {
      restartBtn.style.fontSize = Math.round(15 * uiScale) + 'px';
      restartBtn.style.padding = Math.round(8 * uiScale) + 'px ' + Math.round(18 * uiScale) + 'px';
      restartBtn.style.borderRadius = Math.round(26 * uiScale) + 'px';
    }
    // Banner and milestone
    if (banner) {
      banner.style.fontSize = Math.round(21 * uiScale) + 'px';
      banner.style.padding = Math.round(20 * uiScale) + 'px ' + Math.round(18 * uiScale) + 'px';
      banner.style.borderRadius = Math.round(24 * uiScale) + 'px';
    }
    if (milestoneBanner) {
      milestoneBanner.style.fontSize = Math.round(16 * uiScale) + 'px';
      milestoneBanner.style.padding = Math.round(10 * uiScale) + 'px ' + Math.round(14 * uiScale) + 'px';
      milestoneBanner.style.borderRadius = Math.round(18 * uiScale) + 'px';
    }
  }

      // Use devicePixelRatio to scale the backing store for crisp rendering
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.round(GAME_WIDTH * dpr);
      canvas.height = Math.round(GAME_HEIGHT * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Utility Functions ---
    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }
    function showBanner(text, duration = 1200) {
      banner.textContent = text;
      banner.classList.remove('countdown');
      banner.classList.add('show');
      if (bannerTimeout) clearTimeout(bannerTimeout);
      if (duration > 0) {
        bannerTimeout = setTimeout(() => banner.classList.remove('show'), duration);
      }
    }

    function showMilestone(text) {
      milestoneBanner.textContent = text;
      milestoneBanner.classList.add('show');
      setTimeout(() => {
        milestoneBanner.classList.remove('show');
      }, 3000);
    }
    function hideBanner() {
      banner.classList.remove('show', 'countdown');
      if (bannerTimeout) clearTimeout(bannerTimeout);
    }
    function showScore() {
      scoreBubble.textContent = score;
      highScoreBubble.textContent = highScore;
    }
    function showGameOverBanner() {
      showBanner(`Game Over! Score: ${score}`, 0);
    }
    function showMilestoneBanner(val) {
      showMilestone(`Milestone! Score: ${val}`);
    }
    function showCountdownBanner(num) {
      banner.textContent = num;
      banner.classList.add('show', 'countdown');
    }
    function showStartBanner() {
      banner.classList.remove('countdown');
      showBanner('Press S or Click Start', 0);
    }
    function showResetBanner() {
      banner.classList.remove('countdown');
      showBanner('Game Reset - Press ESC anytime', 1500);
    }
    function showGameOverBanner() {
      banner.classList.remove('countdown');
      showBanner(`Game Over! Score: ${score}`, 0);
    }

    // --- Game Classes ---
    class Pipe {
      constructor(x, gapY, variant = 'normal') {
        this.x = x;
        this.gapY = gapY;
        this.gapSize = pipeGap;
        this.passed = false;
        this.variant = variant;
        this.animOffset = Math.random() * Math.PI * 2; // For animated variants
        this.pulsePhase = 0;
        // --- Color System ---
        this.colorTheme = this.getColorTheme();
      }
      update(dt) {
        this.x -= pipeSpeed * dt / 16.67;
        this.pulsePhase += dt / 200; // Animation timing
      }
      
      getColorTheme() {
        const colorThemes = [
          { name: 'forest_green', hue: 120, saturation: 60, lightness: 42 },    // Original, muted
          { name: 'ocean_blue', hue: 210, saturation: 55, lightness: 48 },      // Calming blue
          { name: 'earth_brown', hue: 25, saturation: 45, lightness: 40 },      // Earthy brown
          { name: 'slate_gray', hue: 200, saturation: 25, lightness: 45 },      // Sophisticated gray-blue
          { name: 'deep_purple', hue: 270, saturation: 50, lightness: 45 },     // Rich purple
          { name: 'teal', hue: 180, saturation: 50, lightness: 45 },            // Balanced teal
          { name: 'coral', hue: 15, saturation: 60, lightness: 55 },            // Warm coral (softer than red)
          { name: 'sage', hue: 90, saturation: 35, lightness: 48 }              // Muted sage green
        ];
        
        if (COLOR_TESTING_MODE) {
          // All colors available for testing
          return colorThemes[Math.floor(Math.random() * colorThemes.length)];
        } else {
          // Colors unlock based on difficulty level
          const availableColors = Math.min(difficultyLevel + 1, colorThemes.length);
          return colorThemes[Math.floor(Math.random() * availableColors)];
        }
      }
      
      draw(ctx) {
        ctx.save();
        
        // Apply variant-specific transformations
        let wiggle = 0;
        let colorShift = 0;
        let glowIntensity = 0;
        
        switch(this.variant) {
          case 'wiggle':
            wiggle = Math.sin(this.pulsePhase + this.animOffset) * 3;
            break;
          case 'pulse':
            const pulse = (Math.sin(this.pulsePhase * 2) + 1) * 0.5;
            glowIntensity = pulse * 0.3;
            break;
          case 'rainbow':
            colorShift = Math.sin(this.pulsePhase) * 30;
            break;
          case 'narrow':
            // Special narrow variant handled in gap size
            break;
        }
        
        // Base pipe colors with variant modifications
        const baseHue = this.colorTheme.hue + colorShift;
        const baseColor = `hsl(${baseHue}, ${this.colorTheme.saturation}%, ${this.colorTheme.lightness}%)`;
        const highlightColor = `hsl(${baseHue}, ${this.colorTheme.saturation - 10}%, ${this.colorTheme.lightness + 20}%)`;
        const darkColor = `hsl(${baseHue}, ${this.colorTheme.saturation + 10}%, ${this.colorTheme.lightness - 20}%)`;
        
        // Create gradient with glow effect
        const gradient = ctx.createLinearGradient(this.x, 0, this.x + PIPE_WIDTH, 0);
        gradient.addColorStop(0, baseColor);
        gradient.addColorStop(0.3, highlightColor);
        gradient.addColorStop(0.7, baseColor);
        gradient.addColorStop(1, darkColor);
        
        ctx.fillStyle = gradient;
        ctx.strokeStyle = darkColor;
        ctx.lineWidth = 3;
        
        // Add glow effect for pulse variant
        if (glowIntensity > 0) {
          ctx.shadowColor = highlightColor;
          ctx.shadowBlur = 15 * glowIntensity;
        }
        
        // Top pipe with wiggle
        ctx.beginPath();
        ctx.roundRect(this.x + wiggle, 0, PIPE_WIDTH, this.gapY, [0, 0, 15, 15]);
        ctx.fill();
        ctx.stroke();
        
        // Bottom pipe with wiggle
        ctx.beginPath();
        ctx.roundRect(this.x + wiggle, this.gapY + this.gapSize, PIPE_WIDTH, 
                     GAME_HEIGHT - GROUND_HEIGHT - this.gapY - this.gapSize, [15, 15, 0, 0]);
        ctx.fill();
        ctx.stroke();
        
        // Pipe caps with variant effects
        ctx.shadowBlur = 0;
        ctx.fillStyle = highlightColor;
        ctx.fillRect(this.x - 5 + wiggle, this.gapY - 20, PIPE_WIDTH + 10, 20);
        ctx.fillRect(this.x - 5 + wiggle, this.gapY + this.gapSize, PIPE_WIDTH + 10, 20);
        ctx.strokeRect(this.x - 5 + wiggle, this.gapY - 20, PIPE_WIDTH + 10, 20);
        ctx.strokeRect(this.x - 5 + wiggle, this.gapY + this.gapSize, PIPE_WIDTH + 10, 20);
        
        ctx.restore();
      }
      collides(man) {
        // Check collision with man (circle) and pipe rects
        if (
          man.x + MAN_RADIUS > this.x &&
          man.x - MAN_RADIUS < this.x + PIPE_WIDTH
        ) {
          if (man.y - MAN_RADIUS < this.gapY || man.y + MAN_RADIUS > this.gapY + this.gapSize) {
            return true;
          }
        }
        return false;
      }
    }

    class Man {
      constructor() {
        this.x = MAN_X;
        this.y = GAME_HEIGHT / 2;
        this.vy = 0;
        this.animPhase = 0;
        this.flapAnim = 0;
        this.rotation = 0;
      }
      flap() {
        this.vy = FLAP_VELOCITY;
        this.flapAnim = 1.0;
      }
      update(dt) {
        this.vy += GRAVITY * dt / 16.67;
        this.vy = clamp(this.vy, -12, MAX_DROP);
        this.y += this.vy * dt / 16.67;
        this.y = clamp(this.y, MAN_RADIUS, GAME_HEIGHT - GROUND_HEIGHT - MAN_RADIUS);
        // Animate limbs
        this.animPhase += dt / ANIM_FREQ;
        if (this.flapAnim > 0) this.flapAnim -= dt / 120;
        else this.flapAnim = 0;
        // Rotation based on vy
        this.rotation = clamp(this.vy * 0.07, -0.45, 0.55);
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        // --- Draw body parts using CSS-like colors ---
        // Shadow
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.beginPath();
        ctx.ellipse(0, MAN_RADIUS + 12, MAN_RADIUS * 0.9, 8, 0, 0, 2 * Math.PI);
        ctx.fillStyle = '#000';
        ctx.fill();
        ctx.restore();
        // Torso with gradient and details
        ctx.save();
        const torsoGrad = ctx.createLinearGradient(-18, -10, 18, 30);
        torsoGrad.addColorStop(0, '#2196f3');
        torsoGrad.addColorStop(0.3, '#2196f3');
        torsoGrad.addColorStop(1, '#1565c0');
        ctx.beginPath();
        ctx.ellipse(0, 10, 18, 28, 0, 0, 2 * Math.PI);
        ctx.fillStyle = torsoGrad;
        ctx.fill();
        // Shirt details
        ctx.strokeStyle = '#1565c0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, 5, 12, 2, 0, 0, Math.PI);
        ctx.stroke();
        ctx.restore();
        // Head with enhanced features
        ctx.save();
        // Head shadow for depth
        ctx.beginPath();
        ctx.arc(1, -20, 15, 0, 2 * Math.PI);
        ctx.fillStyle = '#e0a060';
        ctx.fill();
        // Main head
        ctx.beginPath();
        ctx.arc(0, -22, 15, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffcc80';
        ctx.fill();
        // Hair with highlights
        ctx.beginPath();
        ctx.arc(0, -28, 10, Math.PI * 1.1, Math.PI * 1.9, false);
        ctx.lineTo(0, -22);
        ctx.closePath();
        ctx.fillStyle = '#6d4c41';
        ctx.fill();
        // Hair highlights
        ctx.beginPath();
        ctx.arc(-3, -30, 4, Math.PI * 1.2, Math.PI * 1.6, false);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#8d6e63';
        ctx.stroke();
        // Eyes with highlights
        ctx.beginPath();
        ctx.arc(-5, -25, 2.2, 0, 2 * Math.PI);
        ctx.arc(5, -25, 2.2, 0, 2 * Math.PI);
        ctx.fillStyle = '#1a1a1a';
        ctx.fill();
        // Eye highlights
        ctx.beginPath();
        ctx.arc(-4, -26, 0.8, 0, 2 * Math.PI);
        ctx.arc(6, -26, 0.8, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        // Enhanced mouth
        ctx.beginPath();
        ctx.arc(0, -16, 4, Math.PI * 0.1, Math.PI * 1.0, false);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#e53935';
        ctx.stroke();
        ctx.restore();
        // Arms (animated)
        for (let i = 0; i < 2; i++) {
          ctx.save();
          const side = i === 0 ? -1 : 1;
          let swing = Math.sin(this.animPhase * 1.5 + i * Math.PI) * 0.5 + (this.flapAnim * 0.7);
          ctx.rotate(side * (0.5 + swing * 0.5));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(side * 22, 18);
          ctx.lineWidth = 7.5;
          ctx.strokeStyle = 'var(--man-skin)';
          ctx.lineCap = 'round';
          ctx.stroke();
          // Hand
          ctx.beginPath();
          ctx.arc(side * 22, 18, 5, 0, 2 * Math.PI);
          ctx.fillStyle = '#ffcc80';
          ctx.fill();
          ctx.restore();
        }
        // Legs with enhanced styling
        for (let i = 0; i < 2; i++) {
          ctx.save();
          const side = i === 0 ? -1 : 1;
          let kick = Math.sin(this.animPhase * 1.2 + i * Math.PI) * 0.5 - (this.flapAnim * 0.5);
          ctx.rotate(side * (0.25 + kick * 0.4));
          
          // Leg gradient
          const legGrad = ctx.createLinearGradient(0, 28, side * 13, 48);
          legGrad.addColorStop(0, '#424242');
          legGrad.addColorStop(1, '#212121');
          
          ctx.beginPath();
          ctx.moveTo(0, 28);
          ctx.lineTo(side * 13, 48);
          ctx.lineWidth = 8.5;
          ctx.strokeStyle = legGrad;
          ctx.lineCap = 'round';
          ctx.stroke();
          
          // Enhanced shoe with gradient
          const shoeGrad = ctx.createRadialGradient(side * 13, 48, 2, side * 13, 48, 6);
          shoeGrad.addColorStop(0, '#a1887f');
          shoeGrad.addColorStop(1, '#795548');
          
          ctx.beginPath();
          ctx.arc(side * 13, 48, 6, 0, 2 * Math.PI);
          ctx.fillStyle = shoeGrad;
          ctx.fill();
          
          // Shoe sole
          ctx.beginPath();
          ctx.ellipse(side * 13, 52, 7, 2, 0, 0, 2 * Math.PI);
          ctx.fillStyle = '#795548';
          ctx.fill();
          
          ctx.restore();
        }
        ctx.restore();
      }
    }

    // --- Game Logic ---
    function _resetGameState(showStartUI) {
      // Clear timers
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      if (bannerTimeout) { clearTimeout(bannerTimeout); bannerTimeout = null; }

      state = 'init';
      score = 0;
      pipes = [];
      pipeSpeed = PIPE_SPEED_START;
      pipeFreq = PIPE_FREQ_START;
      pipeGap = PIPE_GAP_START;
      pipeCount = 0;
      difficultyLevel = 0;
      lastPipeTime = 0;
      milestoneIdx = 0;
      countdown = 3;
      animTimer = 0;
      touchFlap = false;
      man = new Man();
      man.x = MAN_X;
      man.y = GAME_HEIGHT / 2;
      man.vy = 0;
      man.animPhase = 0;
      man.flapAnim = 0;
      man.rotation = 0;

      showScore();
      hideBanner();
      if (showStartUI) {
        showStartBanner();
        startBtn.style.display = '';
      } else {
        startBtn.style.display = 'none';
      }
      restartBtn.style.display = 'none';

      // Immediate visual reset
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
      draw();
    }
    function resetGame() { _resetGameState(true); }
    function startCountdown() {
      state = 'countdown';
      countdown = 3;
      showCountdownBanner(countdown);
      startBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      countdownTimer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          showCountdownBanner(countdown);
        } else if (countdown === 0) {
          showCountdownBanner('GO!');
          setTimeout(() => {
            clearInterval(countdownTimer);
            hideBanner();
            startGame();
          }, 500);
        }
      }, 700);
    }
    function startGame() {
      state = 'running';
      lastPipeTime = performance.now();
      hideBanner();
      startBtn.style.display = 'none';
      restartBtn.style.display = 'none';
      AudioManager.init();
      // optional: play short intro tone
      // AudioManager.playScore();
    }
    function gameOver() {
        state = 'gameover';
        try { AudioManager.playHit(); } catch (e) {}
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappyManHighScore', String(highScore));
        showBanner(`New High Score: ${highScore}!`, 1800);
      } else {
        showGameOverBanner();
      }
      restartBtn.style.display = '';
      startBtn.style.display = 'none';
      showScore();
    }
    function restartGame() {
        _resetGameState(true); // showStartUI = true, so Start button appears
        // Do NOT start countdown automatically; user must click Start
    }
    // Difficulty progression system
    function updateDifficulty() {
      const newDifficultyLevel = Math.floor(pipeCount / DIFFICULTY_INTERVAL);
      
      if (newDifficultyLevel > difficultyLevel) {
        difficultyLevel = newDifficultyLevel;
        
        // Increase speed
        pipeSpeed = PIPE_SPEED_START + (difficultyLevel * PIPE_SPEED_INC);
        
        // Decrease pipe frequency (pipes appear faster)
        pipeFreq = Math.max(PIPE_FREQ_MIN, PIPE_FREQ_START - (difficultyLevel * 100));
        
        // Gradually decrease gap size
        pipeGap = Math.max(PIPE_GAP_MIN, PIPE_GAP_START - (difficultyLevel * 8));
        
        // Show difficulty increase banner
        if (difficultyLevel > 0) {
          showDifficultyBanner(difficultyLevel);
        }
      }
    }
    
    function getPipeVariant() {
  // All variants possible and random from the start
  const rand = Math.random();
  if (rand < 0.15) return 'wiggle';
  if (rand < 0.25) return 'pulse';
  if (rand < 0.35) return 'rainbow';
  if (rand < 0.4) return 'narrow';
  return 'normal';
}
    
    function showDifficultyBanner(level) {
      const messages = [
        '', // level 0
        'Getting Warmer!',
        'Picking Up Speed!',
        'Things Get Interesting...',
        'Visual Chaos Begins!',
        'Maximum Difficulty!'
      ];
      
      if (level < messages.length) {
        showMilestone(messages[level]);
      }
    }
    function flap() {
      if (state === 'running') {
        man.flap();
        try { AudioManager.playFlap(); } catch(e) {}
      }
    }
    function update(dt) {
      // Do nothing in 'init' state (man stays at center, no animation, no gravity)
      if (state === 'init') {
        return;
      }
      // Allow only animation during countdown, but no physics/gravity
      if (state === 'countdown') {
        man.animPhase += dt / ANIM_FREQ;
        if (man.flapAnim > 0) man.flapAnim -= dt / 120;
        else man.flapAnim = 0;
        return;
      }
      // Paused: do not advance physics or pipes, but allow gentle idle animation
      if (state === 'paused') {
        man.animPhase += dt / (ANIM_FREQ * 1.2);
        return;
      }
      // Only update physics and pipes in 'running' state
      if (state === 'running') {
        man.update(dt);
        // Pipes
        for (let pipe of pipes) pipe.update(dt);
        // Remove off-screen pipes
        pipes = pipes.filter(p => p.x + PIPE_WIDTH > 0);
        // Add new pipes with difficulty progression
        if (performance.now() - lastPipeTime > pipeFreq) {
          let gapY = PIPE_MIN + Math.random() * (PIPE_MAX - PIPE_MIN);
          // Adjust gap positioning for smaller gaps
          const maxGapY = GAME_HEIGHT - GROUND_HEIGHT - pipeGap - 40;
          if (gapY > maxGapY) gapY = maxGapY;
          // Get pipe variant based on difficulty
          const variant = getPipeVariant();
          // Special handling for narrow variant
          if (variant === 'narrow') {
            const narrowPipe = new Pipe(GAME_WIDTH, gapY, variant);
            narrowPipe.gapSize = Math.max(120, pipeGap - 20); // Extra narrow gap
            pipes.push(narrowPipe);
          } else {
            pipes.push(new Pipe(GAME_WIDTH, gapY, variant));
          }
          lastPipeTime = performance.now();
          pipeCount++;
          // Update difficulty every 20 pipes
          updateDifficulty();
        }
        // Collision
        for (let pipe of pipes) {
          if (pipe.collides(man)) {
            gameOver();
            return;
          }
        }
        // Ground collision
        if (man.y + MAN_RADIUS >= GAME_HEIGHT - GROUND_HEIGHT) {
          gameOver();
          return;
        }
        // Score
        for (let pipe of pipes) {
          if (!pipe.passed && pipe.x + PIPE_WIDTH < man.x) {
            pipe.passed = true;
            score++;
            showScore();
            try { AudioManager.playScore(); } catch(e) {}
            if (milestoneIdx < MILESTONES.length && score === MILESTONES[milestoneIdx]) {
              showMilestoneBanner(score);
              milestoneIdx++;
            }
          }
        }
      }
    }
    function draw() {
      // Clear
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
      // Time for subtle animations (parallax)
      const time = performance.now() * 0.0001;
      
      // Enhanced forest landscape background
      ctx.save();
      
      // Enhanced sky gradient with smoother transitions
      let skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.6);
      skyGrad.addColorStop(0, '#87ceeb');
      skyGrad.addColorStop(0.15, '#9dd4f2');
      skyGrad.addColorStop(0.3, '#b8e6ff');
      skyGrad.addColorStop(0.6, '#cef0ff');
      skyGrad.addColorStop(0.85, '#e1f5fe');
      skyGrad.addColorStop(1, '#f0f9ff');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.6);
      
  // Distant mountains (multiple layers for depth)
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#2c5f2d';
  // gentle parallax horizontal offset (very slow)
  const distantOffset = Math.sin(time * 0.6) * (GAME_WIDTH * 0.005);
  ctx.beginPath();
  ctx.moveTo(0 + distantOffset, GAME_HEIGHT * 0.35);
  ctx.lineTo(GAME_WIDTH * 0.2 + distantOffset, GAME_HEIGHT * 0.25);
  ctx.lineTo(GAME_WIDTH * 0.4 + distantOffset, GAME_HEIGHT * 0.3);
  ctx.lineTo(GAME_WIDTH * 0.7 + distantOffset, GAME_HEIGHT * 0.2);
  ctx.lineTo(GAME_WIDTH + distantOffset, GAME_HEIGHT * 0.28);
  ctx.lineTo(GAME_WIDTH + distantOffset, GAME_HEIGHT * 0.6);
  ctx.lineTo(0 + distantOffset, GAME_HEIGHT * 0.6);
  ctx.closePath();
  ctx.fill();
  // Soft ridge to separate from mid-range (very subtle)
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0 + distantOffset, GAME_HEIGHT * 0.35);
  ctx.lineTo(GAME_WIDTH * 0.2 + distantOffset, GAME_HEIGHT * 0.25);
  ctx.lineTo(GAME_WIDTH * 0.4 + distantOffset, GAME_HEIGHT * 0.3);
  ctx.lineTo(GAME_WIDTH * 0.7 + distantOffset, GAME_HEIGHT * 0.2);
  ctx.lineTo(GAME_WIDTH + distantOffset, GAME_HEIGHT * 0.28);
  ctx.stroke();
  ctx.restore();
      
  // Mid-range mountains
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#3e7b40';
  // moderate parallax offset
  const midOffset = Math.sin(time * 0.9 + 0.5) * (GAME_WIDTH * 0.01);
  ctx.beginPath();
  ctx.moveTo(0 + midOffset, GAME_HEIGHT * 0.45);
  ctx.lineTo(GAME_WIDTH * 0.15 + midOffset, GAME_HEIGHT * 0.35);
  ctx.lineTo(GAME_WIDTH * 0.35 + midOffset, GAME_HEIGHT * 0.4);
  ctx.lineTo(GAME_WIDTH * 0.6 + midOffset, GAME_HEIGHT * 0.3);
  ctx.lineTo(GAME_WIDTH * 0.85 + midOffset, GAME_HEIGHT * 0.38);
  ctx.lineTo(GAME_WIDTH + midOffset, GAME_HEIGHT * 0.42);
  ctx.lineTo(GAME_WIDTH + midOffset, GAME_HEIGHT * 0.6);
  ctx.lineTo(0 + midOffset, GAME_HEIGHT * 0.6);
  ctx.closePath();
  ctx.fill();
  // Gentle highlight along top edge to suggest light
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0 + midOffset, GAME_HEIGHT * 0.45);
  ctx.lineTo(GAME_WIDTH * 0.15 + midOffset, GAME_HEIGHT * 0.35);
  ctx.lineTo(GAME_WIDTH * 0.35 + midOffset, GAME_HEIGHT * 0.4);
  ctx.lineTo(GAME_WIDTH * 0.6 + midOffset, GAME_HEIGHT * 0.3);
  ctx.lineTo(GAME_WIDTH * 0.85 + midOffset, GAME_HEIGHT * 0.38);
  ctx.lineTo(GAME_WIDTH + midOffset, GAME_HEIGHT * 0.42);
  ctx.stroke();
  ctx.restore();
      
  // Foreground hills
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#4a9d4e';
  // small parallax offset for foreground (faster but still subtle)
  const frontOffset = Math.sin(time * 1.2 + 1.2) * (GAME_WIDTH * 0.02);
  ctx.beginPath();
  ctx.moveTo(0 + frontOffset, GAME_HEIGHT * 0.55);
  ctx.lineTo(GAME_WIDTH * 0.25 + frontOffset, GAME_HEIGHT * 0.45);
  ctx.lineTo(GAME_WIDTH * 0.5 + frontOffset, GAME_HEIGHT * 0.5);
  ctx.lineTo(GAME_WIDTH * 0.75 + frontOffset, GAME_HEIGHT * 0.4);
  ctx.lineTo(GAME_WIDTH + frontOffset, GAME_HEIGHT * 0.48);
  ctx.lineTo(GAME_WIDTH + frontOffset, GAME_HEIGHT * 0.6);
  ctx.lineTo(0 + frontOffset, GAME_HEIGHT * 0.6);
  ctx.closePath();
  ctx.fill();
  // Soft base haze to separate hills from mid-ground
  ctx.globalCompositeOperation = 'destination-over';
  ctx.globalAlpha = 0.15;
  const baseHaze = ctx.createLinearGradient(0, GAME_HEIGHT * 0.48, 0, GAME_HEIGHT * 0.62);
  baseHaze.addColorStop(0, 'rgba(0,0,0,0.12)');
  baseHaze.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = baseHaze;
  ctx.fillRect(0, GAME_HEIGHT * 0.48, GAME_WIDTH, GAME_HEIGHT * 0.12);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
      
      // Winding river
      ctx.save();
      ctx.strokeStyle = '#4fc3f7';
      ctx.fillStyle = '#81d4fa';
      ctx.lineWidth = 8;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.moveTo(GAME_WIDTH * 0.1, GAME_HEIGHT * 0.5);
      ctx.quadraticCurveTo(GAME_WIDTH * 0.3, GAME_HEIGHT * 0.42, GAME_WIDTH * 0.5, GAME_HEIGHT * 0.48);
      ctx.quadraticCurveTo(GAME_WIDTH * 0.7, GAME_HEIGHT * 0.54, GAME_WIDTH * 0.9, GAME_HEIGHT * 0.46);
      ctx.stroke();
      ctx.restore();
      
  // Trees at various depths and positions
      
      // Distant pine trees
      for (let i = 0; i < 8; i++) {
        ctx.save();
        const treeX = (GAME_WIDTH / 8) * i + (i * 20);
        const treeY = GAME_HEIGHT * (0.45 + Math.sin(i) * 0.05);
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#1b4332';
        drawPineTree(ctx, treeX, treeY, 15, 35);
        ctx.restore();
      }
      
      // Mid-range oak trees
      for (let i = 0; i < 6; i++) {
        ctx.save();
        const treeX = (GAME_WIDTH / 6) * i + (i * 30) + 40;
        const treeY = GAME_HEIGHT * (0.5 + Math.sin(i * 1.5) * 0.03);
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#2d5016';
        drawOakTree(ctx, treeX, treeY, 20, 45);
        ctx.restore();
      }
      
      // Foreground birch trees
      for (let i = 0; i < 4; i++) {
        ctx.save();
        const treeX = (GAME_WIDTH / 4) * i + (i * 50) + 60;
        const treeY = GAME_HEIGHT * (0.52 + Math.sin(i * 2) * 0.02);
        ctx.globalAlpha = 0.8;
        drawBirchTree(ctx, treeX, treeY, 12, 50);
        ctx.restore();
      }
      
      // Atmospheric mist/fog
      ctx.save();
      const mistGrad = ctx.createRadialGradient(GAME_WIDTH/2, GAME_HEIGHT * 0.4, 0, GAME_WIDTH/2, GAME_HEIGHT * 0.4, GAME_WIDTH);
      mistGrad.addColorStop(0, 'rgba(255,255,255,0.1)');
      mistGrad.addColorStop(0.5, 'rgba(255,255,255,0.05)');
      mistGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = mistGrad;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT * 0.6);
      ctx.restore();
      
      ctx.restore();

  // Simple green gradient fill for lower background area (between scenery and ground)
  ctx.save();
  const midGrad = ctx.createLinearGradient(0, GAME_HEIGHT * 0.60, 0, GAME_HEIGHT - GROUND_HEIGHT);
  midGrad.addColorStop(0, '#b8e0b2');
  midGrad.addColorStop(0.5, '#a4d49d');
  midGrad.addColorStop(1, '#8ac07f');
  ctx.fillStyle = midGrad;
  ctx.fillRect(0, GAME_HEIGHT * 0.60, GAME_WIDTH, (GAME_HEIGHT - GROUND_HEIGHT) - GAME_HEIGHT * 0.60);
  ctx.restore();
      
      // Pipes
      for (let pipe of pipes) pipe.draw(ctx);
      
      // Enhanced ground with forest floor texture
      ctx.save();
      const groundGrad = ctx.createLinearGradient(0, GAME_HEIGHT - GROUND_HEIGHT, 0, GAME_HEIGHT);
      groundGrad.addColorStop(0, '#6d4c41');
      groundGrad.addColorStop(0.3, '#8d6e63');
      groundGrad.addColorStop(1, '#5d4037');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GAME_HEIGHT - GROUND_HEIGHT, GAME_WIDTH, GROUND_HEIGHT);
      
      // Forest floor details (fallen leaves, rocks)
      ctx.fillStyle = '#4e342e';
      for (let i = 0; i < GAME_WIDTH; i += 25) {
        ctx.fillRect(i, GAME_HEIGHT - GROUND_HEIGHT + 8, 12, 4);
        ctx.fillRect(i + 10, GAME_HEIGHT - GROUND_HEIGHT + 20, 8, 3);
      }
      
      // Small rocks and pebbles
      ctx.fillStyle = '#3e2723';
      for (let i = 0; i < GAME_WIDTH; i += 40) {
        ctx.beginPath();
        ctx.arc(i + 5, GAME_HEIGHT - GROUND_HEIGHT + 15, 3, 0, 2 * Math.PI);
        ctx.fill();
      }
      ctx.restore();
      
      // Man
      man.draw(ctx);
    }
    
    // Helper functions for drawing different tree types
    function drawPineTree(ctx, x, y, width, height) {
      // Trunk
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(x - 2, y, 4, height * 0.3);
      
      // Pine layers (3 triangular sections)
      ctx.fillStyle = '#1b4332';
      for (let i = 0; i < 3; i++) {
        const layerY = y - (height * 0.25 * i);
        const layerWidth = width - (i * 3);
        ctx.beginPath();
        ctx.moveTo(x, layerY - height * 0.3);
        ctx.lineTo(x - layerWidth/2, layerY);
        ctx.lineTo(x + layerWidth/2, layerY);
        ctx.closePath();
        ctx.fill();
      }
    }
    
    function drawOakTree(ctx, x, y, width, height) {
      // Trunk
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(x - 3, y, 6, height * 0.4);
      
      // Crown (circular with irregular edges)
      ctx.fillStyle = '#2d5016';
      ctx.beginPath();
      ctx.arc(x, y - height * 0.3, width/2, 0, 2 * Math.PI);
      ctx.fill();
      
      // Additional foliage clumps
      ctx.beginPath();
      ctx.arc(x - width/3, y - height * 0.2, width/3, 0, 2 * Math.PI);
      ctx.arc(x + width/3, y - height * 0.25, width/3, 0, 2 * Math.PI);
      ctx.fill();
    }
    
    function drawBirchTree(ctx, x, y, width, height) {
      // White trunk with black marks
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(x - 2, y, 4, height * 0.6);
      
      // Black birch marks
      ctx.fillStyle = '#333';
      ctx.fillRect(x - 2, y + height * 0.1, 4, 2);
      ctx.fillRect(x - 2, y + height * 0.3, 4, 1);
      ctx.fillRect(x - 2, y + height * 0.45, 4, 2);
      
      // Light green foliage
      ctx.fillStyle = '#66bb6a';
      ctx.beginPath();
      ctx.arc(x, y - height * 0.2, width/2, 0, 2 * Math.PI);
      ctx.fill();
      
      // Drooping branches
      ctx.strokeStyle = '#66bb6a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - width/3, y - height * 0.15);
      ctx.quadraticCurveTo(x - width/2, y - height * 0.05, x - width/2.5, y);
      ctx.moveTo(x + width/3, y - height * 0.15);
      ctx.quadraticCurveTo(x + width/2, y - height * 0.05, x + width/2.5, y);
      ctx.stroke();
    }
    let lastTime = performance.now();
    function gameLoop() {
      let now = performance.now();
      let dt = clamp(now - lastTime, 8, 32);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }
    // --- Controls ---
    function handleKey(e) {
      if (e.repeat) return;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        flap();
        e.preventDefault();
      } else if (e.code === 'KeyS') {
        if (state === 'init' || state === 'gameover') startCountdown();
      } else if (e.code === 'KeyR') {
          if (state === 'gameover') {
            restartGame();
          }
      } else if (e.code === 'Escape') {
        resetGame();
      } else if (e.code === 'KeyP') {
        if (state === 'running') {
          state = 'paused';
          showBanner('Paused - Press P', 0);
        } else if (state === 'paused') {
          state = 'running';
          hideBanner();
        }
      }
    }
    function handleTouch(e) {
      if (e.type === 'touchstart' || e.type === 'pointerdown') {
        // Restrict post-gameover restarts to only the Restart button
        if (state === 'gameover') {
          // [RESUME_FEATURE_TAG] Future: resume logic should be added here for touch/pointer resume
          if (e.target === restartBtn) {
            restartGame();
          }
        } else if (state === 'init') {
          startCountdown();
        } else if (state === 'running') {
          flap();
        }
        e.preventDefault();
      }
    }
    // --- Button Events ---
    startBtn.addEventListener('click', () => {
      if (state === 'init') startCountdown();
    });
    restartBtn.addEventListener('click', () => {
      if (state === 'gameover') {
        restartGame();
      }
    });
    const muteBtn = document.getElementById('mute-btn');
    if (muteBtn) {
      muteBtn.addEventListener('click', () => {
        const muted = AudioManager.toggleMute();
        muteBtn.textContent = muted ? '🔈' : '🔊';
      });
    }
    // --- Keyboard ---
    window.addEventListener('keydown', handleKey);
    // --- Touch/Pointer ---
  gameContainer.addEventListener('touchstart', handleTouch, { passive: false });
  gameContainer.addEventListener('pointerdown', handleTouch, { passive: false });
    // --- Accessibility: Focus canvas for keyboard ---
    gameContainer.addEventListener('click', () => canvas.focus());
    // --- Start ---
    resetGame();
    gameLoop();
  </script>
